name: Publish widget gallery

# Deliberately manual. Requires GitHub Pages > Build and deployment > GitHub Actions.
# Run only after the gallery PR is reviewed and merged into main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: example
        run: flutter pub get
      - name: Build Flutter Web gallery
        working-directory: example
        run: flutter build web --release --target lib/gallery.dart --base-href /neumorphic_widgets/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: example/build/web
      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v4
