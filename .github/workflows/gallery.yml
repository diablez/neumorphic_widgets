name: Widget gallery

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'example/**'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install example dependencies
        run: flutter pub get
        working-directory: example
      - name: Build the interactive gallery
        run: flutter build web --release --target lib/gallery.dart --base-href /neumorphic_widgets/
        working-directory: example
      - name: Upload gallery preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: neumorphic-widgets-gallery
          path: example/build/web/
          if-no-files-found: error
